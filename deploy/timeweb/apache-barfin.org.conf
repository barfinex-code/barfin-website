<VirtualHost *:80>
    ServerName barfin.org
    ServerAlias www.barfin.org

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5108/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:5108/
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'"

    ErrorLog ${APACHE_LOG_DIR}/barfin-website-error.log
    CustomLog ${APACHE_LOG_DIR}/barfin-website-access.log combined
</VirtualHost>
